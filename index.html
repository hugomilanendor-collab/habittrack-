<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111"><meta name="description" content="HabitTrack: seguimiento sencillo de hábitos y rachas.">
<link rel="manifest" href="manifest.webmanifest">
<title>HabitTrack</title>
<style>
:root{color-scheme:dark;--bg:#111111;--panel:#1b1b1b;--panel2:#252525;--text:#f1f1f1;--muted:#a5a5a5;--line:#393939;--green1:#174d30;--green7:#398b55;--green30:#a7e8b5;--red:#a83232;--gray:#343434}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}.app{max-width:760px;margin:auto;padding:22px 16px 40px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{font-size:27px;font-weight:800;letter-spacing:-1px}.sub,.muted{color:var(--muted);font-size:13px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.tab,.habit,.secondary,.primary{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:11px 8px}.tab.active,.habit.active{background:#383838;border-color:#686868}.habitrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.habit{padding:8px 13px}.habitwrap{display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px 5px 3px 3px}.habitwrap.active{background:#303030;border-color:#686868}.habitwrap .habit{border:0;background:transparent;padding:7px 8px}.removehabit{border:0;background:#393939;color:#eeeeee;border-radius:8px;width:29px;height:29px;font-weight:800;line-height:1}.add{display:flex;gap:8px;margin:12px 0 20px}.add input{min-width:0;flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px}.primary{background:#eeeeee;color:#171717;border-color:#eeeeee;font-weight:700;padding:11px 15px}.secondary{padding:9px 12px}.section{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.sectionhead h2{font-size:19px;margin:0}.monthnav{display:flex;align-items:center;gap:12px}.monthnav button{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 11px}.week,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.week div{text-align:center;color:var(--muted);font-size:12px;padding:5px 0}.day{aspect-ratio:1;border:0;border-radius:9px;background:var(--gray);font-weight:650;min-width:0}.day.empty{visibility:hidden}.day.future{background:#343d37;color:#a9b1ab}.day.missed{background:var(--red);color:white}.day.done1{background:var(--green1);color:white}.day.done7{background:var(--green7);color:white}.day.done30{background:var(--green30);color:#12351d}.day.today{outline:2px solid #fff;outline-offset:2px}.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:15px;color:var(--muted);font-size:12px}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:var(--panel2);border-radius:13px;padding:14px}.num{font-size:28px;font-weight:800}.label{font-size:12px;color:var(--muted)}.progress{height:9px;background:var(--gray);border-radius:20px;overflow:hidden;margin-top:7px}.bar{height:100%;background:#bdbdbd;border-radius:20px}.yeargrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.monthbox{background:var(--panel2);padding:9px;border-radius:11px;min-width:0}.monthname{font-size:12px;font-weight:700;margin-bottom:7px}.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.cell{aspect-ratio:1;border-radius:2px;background:var(--gray)}.cell.missed{background:var(--red)}.cell.done1{background:var(--green1)}.cell.done7{background:var(--green7)}.cell.done30{background:var(--green30)}.goal{margin:14px 0}.goalhead{display:flex;justify-content:space-between;font-size:13px}.notice{background:var(--panel2);border-radius:12px;padding:12px;color:var(--muted);font-size:13px;line-height:1.45}.emptymsg{color:var(--muted);text-align:center;padding:25px 5px}.foot{color:var(--muted);font-size:11px;text-align:center;margin-top:20px}@media(max-width:420px){.app{padding:17px 12px}.section{padding:13px}.yeargrid{grid-template-columns:repeat(2,minmax(0,1fr))}.day{border-radius:7px}}
</style></head>
<body><main class="app">
<header class="top"><div><div class="brand">HabitTrack</div><div class="sub">Pequeños pasos, grandes rachas.</div></div><div aria-hidden="true" style="font-size:28px">▦</div></header>
<div id="habitList" class="habitrow"></div>
<form id="addForm" class="add"><input id="habitName" maxlength="40" placeholder="Nombre de un nuevo hábito" aria-label="Nombre del hábito"><button class="primary">Añadir</button></form>
<nav class="tabs" aria-label="Secciones"><button class="tab active" data-tab="month">Calendario</button><button class="tab" data-tab="year">Registro anual</button><button class="tab" data-tab="streaks">Rachas</button></nav>
<div id="content"></div>
<div class="foot">Los datos se guardan en este dispositivo. HabitTrack · versión inicial</div>
</main>
<script>
const STORE='habittrack-v1';const today=new Date();today.setHours(0,0,0,0);const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};const plus=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);const months=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
let state;try{state=JSON.parse(localStorage.getItem(STORE))}catch{};if(!state||!Array.isArray(state.habits))state={selected:1,tab:'month',viewYear:today.getFullYear(),viewMonth:today.getMonth(),habits:[{id:1,name:'Leer',done:[]}]};if(state.habits.length&&!state.habits.some(h=>h.id===state.selected))state.selected=state.habits[0].id;let activeTab=state.tab||'month',viewYear=state.viewYear??today.getFullYear(),viewMonth=state.viewMonth??today.getMonth();
function save(){state.tab=activeTab;state.viewYear=viewYear;state.viewMonth=viewMonth;localStorage.setItem(STORE,JSON.stringify(state))}function habit(){return state.habits.find(h=>h.id===state.selected)||state.habits[0]||null}function isDone(h,s){return h.done.includes(s)}function status(h,d){const s=iso(d);if(isDone(h,s))return 'done';if(d<today)return 'missed';return 'future'}function streakEnding(h,d){let n=0;for(let x=new Date(d);isDone(h,iso(x));x=plus(x,-1))n++;return n}function streakClass(h,d){let n=streakEnding(h,d);return n>=30?'done30':n>=7?'done7':'done1'}function currentStreak(h){let d=new Date(today);if(!isDone(h,iso(d)))d=plus(d,-1);let n=0;while(isDone(h,iso(d))){n++;d=plus(d,-1)}return n}function bestStreak(h){let dates=[...h.done].sort();let best=0,n=0,prev=null;for(const s of dates){const d=parse(s);n=prev&&iso(plus(prev,1))===s?n+1:1;best=Math.max(best,n);prev=d}return best}function countYear(h,y){return h.done.filter(s=>s.startsWith(y+'-')).length}
function renderHabits(){const el=document.getElementById('habitList');el.innerHTML='';state.habits.forEach(h=>{const wrap=document.createElement('div');wrap.className='habitwrap'+(h.id===state.selected?' active':'');const b=document.createElement('button');b.className='habit';b.textContent=h.name;b.onclick=()=>{state.selected=h.id;save();render()};const del=document.createElement('button');del.className='removehabit';del.type='button';del.textContent='×';del.title='Eliminar '+h.name;del.setAttribute('aria-label','Eliminar hábito '+h.name);del.onclick=()=>{if(!confirm('¿Quieres eliminar el hábito «'+h.name+'» y todo su historial?'))return;state.habits=state.habits.filter(x=>x.id!==h.id);if(state.selected===h.id)state.selected=state.habits[0]?.id??null;save();render()};wrap.append(b,del);el.append(wrap)})}
function calendar(){const h=habit(),first=new Date(viewYear,viewMonth,1),last=new Date(viewYear,viewMonth+1,0),offset=(first.getDay()+6)%7;let html=`<section class="section"><div class="sectionhead"><h2>${h.name}</h2><div class="monthnav"><button id="prevMonth" aria-label="Mes anterior">‹</button><b>${months[viewMonth]} ${viewYear}</b><button id="nextMonth" aria-label="Mes siguiente">›</button></div></div><div class="week">${['L','M','X','J','V','S','D'].map(x=>`<div>${x}</div>`).join('')}</div><div class="calendar">`;for(let i=0;i<offset;i++)html+='<div class="day empty"></div>';for(let n=1;n<=last.getDate();n++){const d=new Date(viewYear,viewMonth,n),s=iso(d),st=status(h,d);let cls=st==='done'?streakClass(h,d):st==='missed'?'missed':'future';html+=`<button class="day ${cls} ${s===iso(today)?'today':''}" data-date="${s}" ${st!=='future'||s!==iso(today)?'disabled':''} aria-label="Día ${n}">${n}</button>`}html+=`</div><div class="legend"><span><i class="dot" style="background:var(--green1)"></i>Inicio</span><span><i class="dot" style="background:var(--green7)"></i>7 días</span><span><i class="dot" style="background:var(--green30)"></i>30 días</span><span><i class="dot" style="background:var(--red)"></i>No completado</span><span><i class="dot" style="background:var(--gray)"></i>Pendiente</span></div><p class="notice">Puedes marcar únicamente el día de hoy. Cuando termine el día, si no lo has marcado, quedará rojo y no se podrá cambiar.</p></section>`;return html}
function annual(){const h=habit(),y=viewYear;let html=`<section class="section"><div class="sectionhead"><h2>Registro anual · ${h.name}</h2><div class="monthnav"><button id="prevYear">‹</button><b>${y}</b><button id="nextYear">›</button></div></div><div class="yeargrid">`;for(let m=0;m<12;m++){const first=new Date(y,m,1),len=new Date(y,m+1,0).getDate(),offset=(first.getDay()+6)%7;html+=`<div class="monthbox"><div class="monthname">${months[m]}</div><div class="heat">`;for(let i=0;i<offset;i++)html+='<i class="cell"></i>';for(let n=1;n<=len;n++){const d=new Date(y,m,n),st=status(h,d),cls=st==='done'?streakClass(h,d):st==='missed'?'missed':'';html+=`<i class="cell ${cls}" title="${iso(d)}"></i>`}html+='</div></div>'}html+=`</div><div class="legend"><span><i class="dot" style="background:var(--green1)"></i>Completado</span><span><i class="dot" style="background:var(--red)"></i>Fallido</span><span><i class="dot" style="background:var(--gray)"></i>Futuro</span></div><p class="notice">Cada cuadrado representa un día. Los días futuros aún no tienen resultado.</p></section>`;return html}
function streaks(){const h=habit(),cur=currentStreak(h),best=bestStreak(h),total=countYear(h,today.getFullYear());let goals=[7,30,60,100];return `<section class="section"><div class="sectionhead"><h2>Rachas · ${h.name}</h2></div><div class="stats"><div class="stat"><div class="label">Racha actual</div><div class="num">${cur} días</div></div><div class="stat"><div class="label">Mejor racha</div><div class="num">${best} días</div></div><div class="stat"><div class="label">Días completados este año</div><div class="num">${total}</div></div><div class="stat"><div class="label">Días completados en total</div><div class="num">${h.done.length}</div></div></div><h3 style="margin:22px 0 10px">Objetivos de racha</h3>${goals.map(g=>`<div class="goal"><div class="goalhead"><b>${g} días</b><span>${Math.min(cur,g)} / ${g}</span></div><div class="progress"><div class="bar" style="width:${Math.min(100,cur/g*100)}%"></div></div></div>`).join('')}<p class="notice">Una racha se reinicia cuando termina un día sin marcar. La mejor racha conserva tu récord histórico.</p></section>`}
function render(){renderHabits();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));const content=document.getElementById('content');if(!habit()){content.innerHTML='<section class="section emptymsg"><h2>Aún no tienes hábitos</h2><p>Añade uno con el campo de arriba para empezar a registrar tu progreso.</p></section>';return}content.innerHTML=activeTab==='month'?calendar():activeTab==='year'?annual():streaks();document.getElementById('prevMonth')?.addEventListener('click',()=>{viewMonth--;if(viewMonth<0){viewMonth=11;viewYear--}save();render()});document.getElementById('nextMonth')?.addEventListener('click',()=>{viewMonth++;if(viewMonth>11){viewMonth=0;viewYear++}save();render()});document.getElementById('prevYear')?.addEventListener('click',()=>{viewYear--;save();render()});document.getElementById('nextYear')?.addEventListener('click',()=>{viewYear++;save();render()});content.querySelectorAll('[data-date]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.date!==iso(today))return;const h=habit(),i=h.done.indexOf(b.dataset.date);if(i>=0)h.done.splice(i,1);else h.done.push(b.dataset.date);save();render()}))}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{activeTab=b.dataset.tab;save();render()}));document.getElementById('addForm').addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('habitName'),name=input.value.trim();if(!name)return;const id=Math.max(0,...state.habits.map(h=>h.id))+1;state.habits.push({id,name,done:[]});state.selected=id;input.value='';save();render()});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});save();render();
</script></body></html>
